name: Print TL;DR Today

on:
  schedule:
    - cron: "30 2 * * *"   # 08:00 IST every day
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write
  models: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  print:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Gather the news
        run: python build.py
        env:
          TZ: Asia/Kolkata
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      # GitHub pauses scheduled workflows in repos with no commits for 60 days;
      # a one-line edition log keeps the presses running.
      - name: Log the edition
        if: github.event_name == 'schedule'
        run: |
          date '+%F %R %Z' > last-edition.txt
          git config user.name "TL;DR Today Owl"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add last-edition.txt
          git commit -m "Edition of $(date +%F)" && git push
        env:
          TZ: Asia/Kolkata
